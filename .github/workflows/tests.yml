name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Curriculum is in sync
        # Fails if INDEX.md or any in-file teaching header drifts from
        # curriculum/. This is what stops the index rotting.
        run: python -m Utils.sync --check

      - name: Every module imports
        # Two directories were once unimportable because of hyphens in their
        # names, and nine more used Python-2 implicit relative imports. Fifteen
        # modules were dead code that no test could reach. This step makes that
        # class of failure impossible to reintroduce.
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          failures = []
          for name in ["Linear", "Hash", "Non_Linear", "Sorting", "Searching", "Utils", "curriculum", "drills"]:
              package = importlib.import_module(name)
              for module in pkgutil.walk_packages(package.__path__, name + "."):
                  try:
                      importlib.import_module(module.name)
                  except Exception as exc:
                      failures.append(f"{module.name}: {type(exc).__name__}: {exc}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("every module imports")
          PY

      - name: Tests
        run: python -m pytest -m "not flaky" --cov --cov-report=term-missing
